services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inkvite
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inkvite"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  s3mock:
    image: adobe/s3mock:5.2.3
    # run as root: the named volume at /data is root-owned on creation, and
    # s3mock's default user (uid 1000) otherwise can't write its store
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: inkvite
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3mock-data:/data
    ports:
      - "9000:9090"

volumes:
  s3mock-data: